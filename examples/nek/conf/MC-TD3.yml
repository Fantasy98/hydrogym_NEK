runner: 
    ctrl_max_amp    :  0.0638
    ctrl_min_amp    : -0.0638
    action_noise    :  0.1
    npl_state       :  2
    ckpt_int        :  5

    nb_episodes        : 20
    nb_warmup_episodes : 1
    nb_interactions : 2500
    train_steps     : 300
    gradient_steps  : 64
   
    RL_algorithm    : "TD3"
    rescale_actions : True
    learning_rate   : 1e-3
    batch_size      : 256
    buffer_size     : 5_000_000
    learning_starts : 100
    tau             : 0.005
    policy_delay    : 2
    target_policy_noise : 0.0
    target_noise_clip : 0.0

    policy_file     : '../conf/default_ddpg_policy.yml'
    policy          : 'rl_model_9144000_steps'
    load_agent      :  False
    normalize_input : 'utau'
    
    custom_buffer : False   
    keep_frac     : 0.25
    buffer_mode   : 'rotate'
    
    seed            : 1998
    
    random_init     : 6
    rank            : 1
    agent_run_name  : 1998
    
    evaluation      : False
    learnt_policy   : False

    u_tau           : 0.0638
    dUdy            : 12.4271

simulation: 
    CASENAME : "phill"
    exeName : 'nek5000'
    # Update paths for your local case/restart data.
    compile_path   : "../../hydrogym/nek/envs/mini_channel"
    restart_folder : "./data/restarts/rs6_mini_Channel"
    #------------------------------------------
    TOTCTRL : 220
    nproc   : 10         
    ndrl    : 6
    znmf_avg: 1
    target_cfl: 2.0
    retau : 180.0 
    y_sensing : 15.0
    #------------------------------------------

    out_log : 'logfile'
    #------------------------
    # SIZE
    #------------------------
    lx1       :  6
    Lx        :  2.67 
    Ly        :  1.0
    Lz        :  0.8
    Nx        :  4
    Ny        :  16
    Nz        :  4
    nxs       :  1
    nzs       :  1
    #--------------------------
    # .par file 
    #--------------------------
    stopAt : "numSteps"
    numSteps : 500000
    dt       : -1.0e-2
    tmax     : 100000.0
    timeStepper : "bdf3"
    variableDt : "no"
    writeControl : 'timeStep'
    writeInterval : 100_000
    dealiasing : "yes"
    filtering : "none"
    filterWeight : 0.01
    filterCutoffRatio : 0.9
    #[PROBLEMTYPE]
    stressFormulation  :  "no"
    variableProperties  :  "no"
    #[PRESSURE]
    p_residualTol   :  1e-8
    p_residualProj  :  "no"
    #[VELOCITY]
    v_residualTol   :  1e-8
    v_residualProj  :  "no"
    density         :  1.0
    viscosity       :  -2800
    advection       :  "yes"
    
    #[_RUNPAR]
    PARFWRITE :  "no"
    PARFNAME  :  "outparfile"
    
    #[_MONITOR]
    LOGLEVEL  :  1
    WALLTIME  :  "23:45"
    
    #[_CHKPOINT]
    READCHKPT     :  "yes"
    CHKPFNUMBER   :  1
    CHKPINTERVAL  :  10000000

    #[_STAT]
    AVSTEP     :  10
    IOSTEP     :  300_000_000

    #[_TSRS]
    SMPSTEP : 23
