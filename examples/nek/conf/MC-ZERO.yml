runner: 
    ctrl_max_amp    :  1.0
    ctrl_min_amp    : -1.0
    npl_state       :  2
    ckpt_int        :  5

    nb_episodes        : 20
    RL_algorithm    : "ZERO"
    nb_interactions : 2500

    rescale_actions : True

    normalize_input : 'utau'
    
    random_init     : 6
    rank            : 1
    agent_run_name  : 1998
    
    evaluation      : True
    learnt_policy   : True

    u_tau           : 0.0638
    dUdy            : 12.4271

simulation: 
    CASENAME : "phill"
    exeName : 'nek5000'
    # Update paths for your local case/restart data.
    compile_path   : "../../hydrogym/nek/envs/mini_channel"
    restart_folder : "./data/restarts/rs6_mini_Channel"
    #------------------------------------------
    TOTCTRL : 220
    nproc   : 10         
    ndrl    : 6
    znmf_avg: 1
    target_cfl: 2.0
    retau : 180.0 
    y_sensing : 15.0
    #------------------------------------------

    out_log : 'logfile'
    #------------------------
    # SIZE
    #------------------------
    lx1       :  6
    Lx        :  2.67 
    Ly        :  1.0
    Lz        :  0.8
    Nx        :  4
    Ny        :  16
    Nz        :  4
    nxs       :  1
    nzs       :  1
    #--------------------------
    # .par file 
    #--------------------------
    stopAt : "numSteps"
    numSteps : 500000
    dt       : -1.0e-2
    tmax     : 100000.0
    timeStepper : "bdf3"
    variableDt : "no"
    writeControl : 'timeStep'
    writeInterval : 100_000
    dealiasing : "yes"
    filtering : "none"
    filterWeight : 0.01
    filterCutoffRatio : 0.9
    #[PROBLEMTYPE]
    stressFormulation  :  "no"
    variableProperties  :  "no"
    #[PRESSURE]
    p_residualTol   :  1e-8
    p_residualProj  :  "no"
    #[VELOCITY]
    v_residualTol   :  1e-8
    v_residualProj  :  "no"
    density         :  1.0
    viscosity       :  -2800
    advection       :  "yes"
    
    #[_RUNPAR]
    PARFWRITE :  "no"
    PARFNAME  :  "outparfile"
    
    #[_MONITOR]
    LOGLEVEL  :  1
    WALLTIME  :  "23:45"
    
    #[_CHKPOINT]
    READCHKPT     :  "yes"
    CHKPFNUMBER   :  1
    CHKPINTERVAL  :  10000000

    #[_STAT]
    AVSTEP     :  10
    IOSTEP     :  300_000_000

    #[_TSRS]
    SMPSTEP : 23
